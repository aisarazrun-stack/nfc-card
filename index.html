<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Aisar | Digital Card</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: white;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #1c1c1c;
      border-radius: 25px;
      padding: 35px 25px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }

    .profile {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: #333;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 45px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 30px;
    }

    .button {
      display: block;
      text-decoration: none;
      color: white;
      background: #292929;
      padding: 16px;
      margin: 12px 0;
      border-radius: 14px;
      font-size: 16px;
    }

    .button:hover {
      background: #3a3a3a;
    }

    .save {
      background: white;
      color: black;
      font-weight: bold;
      margin-top: 25px;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="profile">
      👤
    </div>

    <h1>AISAR</h1>

    <p class="subtitle">
      Digital Business Card
    </p>

    <a class="button" href="https://wa.me/" target="_blank">
      💬 WhatsApp
    </a>

    <a class="button" href="tel:" target="_blank">
      📞 Call Me
    </a>

    <a class="button" href="#" target="_blank">
      📸 Instagram
    </a>

    <a class="button" href="#" target="_blank">
      🎵 TikTok
    </a>

    <a class="button save" href="#">
      💾 Save Contact
    </a>

  </div>

</body>
</html>
